name: job-tracker
services:
  # Main Application Service (Node.js API + Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-tracker-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-job_tracker}
      - DATABASE_SSL=false
      - ALLOWED_USER_EMAIL=${ALLOWED_USER_EMAIL:-kkent908@gmail.com}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TYPESAFE_AI_API_KEY=${TYPESAFE_AI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - job-tracker-network

  # PostgreSQL 16 Persistence Engine
  db:
    image: postgres:16-alpine
    container_name: job-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound strictly to loopback so DB is never publicly accessible on the host
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-job_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-tracker-network

  # Optional Cloudflare Zero Trust Tunnel for Private Inbound Access
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: job-tracker-tunnel
    restart: unless-stopped
    # Run only if TUNNEL_TOKEN is set via profile or environment
    profiles:
      - with-tunnel
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    networks:
      - job-tracker-network
    depends_on:
      - app

networks:
  job-tracker-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
