<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("job_tracker_theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const useDark = savedTheme === "dark" || (savedTheme !== "light" && prefersDark);
          if (useDark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = useDark ? "dark" : "light";
        } catch {
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <title>Job Tracker - High-Density Autonomous Job Discovery & Triage</title>
    <meta name="description" content="Local ingestion and job tracking backend engine powered by Python JobSpy CLI bridge, Express API, and modern React interface." />
    <meta property="og:title" content="Job Tracker - High-Density Autonomous Job Discovery & Triage" />
    <meta property="og:description" content="Local ingestion and job tracking backend engine powered by Python JobSpy CLI bridge, Express API, and modern React interface." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='20' height='14' x='2' y='7' rx='2' ry='2'/><path d='M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16'/></svg>" />
  </head>
  <body class="bg-[var(--surface-base)] text-[var(--text-primary)] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
